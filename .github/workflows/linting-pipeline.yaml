name: Linting Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npx htmlhint "**/*.html"
      - run: npx stylelint "**/*.css"
git add .
git commit -m "Add linting workflow"
git push origin feature/linting-workflow

